name: CI

on:
  # Manual-only: all CI runs LOCALLY (operator directive 2026-06-19 — the org's
  # GitHub Actions are billing-blocked and we keep CI/deploys off Actions). Run:
  #   pip install -e ".[dev]" && pytest tests/ -m "not hardware"
  # (castor-hal is a path/local dependency that isn't on PyPI, so a hosted runner
  # can't resolve it anyway.) Restore [push, pull_request] if Actions returns.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --cov=so_arm101_actuator --cov-report=term-missing -m "not hardware"
      - name: Coverage gate
        run: |
          coverage report --fail-under=90 --include="src/so_arm101_actuator/protocol.py,src/so_arm101_actuator/actuator.py"
